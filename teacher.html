<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>진로경로 설계소 · 교사용 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f2f7f4;--card:#fff;--ink:#1b2a25;--muted:#5b6c65;--line:#d3dfd8;--accent:#17795e;--accent-d:#0f5c47;--lime:#cdf26b;--warn:#b8451f;--warn-bg:#fdeee7;--ok:#1c7a4f;--ok-bg:#e3f5ea;
 --b1:#2e9db8;--b2:#e98f3c;--b3:#8963bf;--disp:'Jua','Noto Sans KR','Malgun Gothic',sans-serif;--body:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
h1,h2,h3{margin:0;line-height:1.3}p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2a900;outline-offset:2px;border-radius:6px}
.wrap{max-width:1100px;margin:0 auto}.muted{color:var(--muted)}.small{font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;padding:8px 14px;cursor:pointer;min-height:38px}
.btn:hover{background:var(--accent-d)}.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:#fff;color:var(--accent-d);border:1.5px solid var(--accent)}.btn.ghost:hover{background:#eaf7f1}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13.5px;border-radius:8px}
input[type=text],input[type=password],textarea,select{width:100%;border:1.5px solid #b9c9c0;border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
textarea{min-height:90px;resize:vertical}select.inl{width:auto;padding:5px 8px}
.login{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px}.login h1{font-family:var(--disp);font-weight:400;font-size:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.col{display:flex;flex-direction:column;gap:10px}
.err{color:var(--warn);font-weight:700;min-height:1.4em;font-size:14px}
header.top{position:sticky;top:0;z-index:6;background:var(--paper);padding:12px 0 8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
header.top h1{font-family:var(--disp);font-weight:400;font-size:22px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0}.tab{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.card h2{font-family:var(--disp);font-weight:400;font-size:20px;margin-bottom:2px}.card h3{font-size:15px;margin:14px 0 6px}.sub{color:var(--muted);font-size:13.5px;margin-bottom:10px}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}
@media(max-width:820px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
.stat{background:#f4f8f6;border-radius:12px;padding:10px 12px}.stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}.stat span{font-size:13px;color:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;background:#e8efeb}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#eef3f0;border-radius:999px;padding:2px 10px;font-size:13.5px}.chip b{margin-left:4px;color:var(--accent-d)}
.br{display:grid;grid-template-columns:minmax(80px,170px) 1fr 90px;gap:8px;align-items:center;margin:4px 0;font-size:14px}
.br .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br .bt{height:16px;background:#e8efeb;border-radius:8px;overflow:hidden}.br .bt i{display:block;height:100%;background:var(--bc,var(--accent));border-radius:8px}.br .bn{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.tbl{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
th,td{border-bottom:1px solid #e1e9e4;padding:7px 9px;text-align:left;vertical-align:top}th{background:#eaf3ee;font-weight:700;white-space:nowrap}
td.n,th.n{text-align:center;white-space:nowrap}td.w{min-width:200px;white-space:pre-wrap}tr.click{cursor:pointer}tr.click:hover td{background:#f4faf7}
td.h{text-align:center;font-weight:700}.note{background:#f7f9d9;border-radius:10px;padding:8px 12px;font-size:13.5px}
.demo{background:var(--warn-bg);border:1px dashed var(--warn);border-radius:10px;padding:8px 12px;font-size:13.5px;color:#7a2c10}
.empty{color:var(--muted);padding:14px;text-align:center;background:#f4f8f6;border-radius:10px}
.ov{position:fixed;inset:0;background:rgba(15,30,25,.5);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow:auto}
.ov .box{background:#fff;border-radius:16px;max-width:900px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b2a25;color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:90vw}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px 4px;margin:6px 0}.ar{align-self:center;color:#6b7d75;font-style:normal;font-weight:700}
.fn{display:flex;flex-direction:column;justify-content:center;text-align:center;border-radius:12px;padding:6px 10px;min-width:80px;max-width:180px;font-size:13.5px;background:#dfe6e2;border:1.5px solid rgba(0,0,0,.12);line-height:1.35}
.fn small{display:block;font-size:11.5px;color:#3d4d46}.fn.hs{background:#f9d79b}.fn.univ{background:#a9d8f0}.fn.cert{background:#cdbdf0}.fn.work{background:#a8e0b4}.fn.grow{background:#f7b9c8}
.fn.start{background:#e3f1ff;border-radius:999px}.fn.goal{background:#ffc9d6;border-radius:999px;font-weight:700}.fn.dec{background:#cfe6ff;border:2px solid #4b8fd1}
.fn.multi{background:transparent;border:0;padding:0;gap:3px;align-items:stretch}.fn.multi span{display:block;background:#f9d79b;border:1.5px solid rgba(0,0,0,.12);border-radius:10px;padding:3px 8px}
.fn.multi.m span{background:#e6ece8}.fn.multi.u span{background:#a9d8f0}.fn.multi.c span{background:#cdbdf0}.fn.multi.w span{background:#a8e0b4}
pre.out{white-space:pre-wrap;background:#f4f8f6;border-radius:10px;padding:10px 12px;font-family:var(--body);font-size:14px;max-height:480px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <section id="login" class="login" hidden>
    <h1>진로경로 설계소 · 교사용</h1>
    <p class="muted">학생이 제출한 진로경로, 커리어패스 양식, 점검 글을 모아 보고 분석해요.</p>
    <form id="lform" class="panel col" autocomplete="off">
      <label for="tcode" style="font-weight:700">교사 코드</label>
      <input type="password" id="tcode" autocomplete="off" placeholder="시트 ‘설정’ 탭의 교사코드">
      <div class="err" id="lerr" role="alert"></div>
      <button class="btn" type="submit" id="lbtn">들어가기</button>
    </form>
  </section>
  <div id="app" hidden>
    <header class="top"><h1>진로경로 설계소 · 교사용 대시보드</h1>
      <div class="row"><label class="small muted" for="fClass">학급</label><select id="fClass" class="inl"></select>
        <button class="btn ghost sm" data-act="refresh" id="rbtn">새로고침</button>
        <a class="btn ghost sm" id="padA" target="_blank" rel="noopener" style="text-decoration:none">패들렛 ↗</a>
        <button class="btn ghost sm" data-act="logout">나가기</button></div></header>
    <div id="demoBar" class="demo" style="margin-top:10px" hidden>예시 데이터 화면이에요. 실제 학생 자료가 아닙니다.</div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <main id="view"></main>
  </div>
</div>
<div id="ov" class="ov" hidden></div><div class="toast" id="toast" hidden></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwZepe-LhCDFaslcHQTALP2lbZq6vLvDgiI0w2zlkug4D0EgwKQawW7cJvhLBphfa2b/exec";
const PADLET_URL="https://padlet.com/dgkim1013_1/padlet-s024jjsrwj7e9iu41pq3";
const DEMO=!API_URL||location.hash==='#demo';
const STG=[['mid','중학교','m'],['hs','고등학교',''],['univ','대학교','u'],['post','대학 이후','c'],['work','취직','w']];
const ROWS=[['path','경로'],['req','요구조건'],['qual','필요 자격'],['act','학교 내/외 진로활동']];
const STAGE_KO={hs:'고등학교',univ:'대학·대학원',cert:'자격·시험·수련',work:'취업·창업',grow:'자기계발·재진학',etc:'기타'};
const TABS=[['status','제출 현황'],['stats','경로 통계'],['form','커리어패스 양식'],['stu','학생별 보기'],['gen','AI 자동완성'],['ai','AI 분석·내보내기']];
const TAGS=['일반고','특성화고','마이스터고','특목고·자사고','대안학교','전문대','4년제 대학교','대학원','편입','방송·사이버대','학점은행제','자격·면허시험','인턴·수련','취업','창업·개업','재취업·이직','유학'];

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const filled=v=>String(v==null?'':v).trim().length>0,norm=s=>String(s||'').replace(/\s+/g,'').replace(/[.,!?~]+$/,'').toLowerCase();
const pct=(n,d)=>d?Math.round(n*100/d):0,avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0,f1=n=>(Math.round(n*10)/10).toFixed(1);
const fmtAt=ms=>{if(!ms)return'';const d=new Date(ms);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
function counter(){const m=new Map();return{add(l){l=String(l||'').trim();const k=norm(l);if(!k)return;const e=m.get(k)||{n:0,lab:{}};e.n++;e.lab[l]=(e.lab[l]||0)+1;m.set(k,e)},top(n){return[...m.values()].map(e=>({label:Object.entries(e.lab).sort((a,b)=>b[1]-a[1])[0][0],n:e.n})).sort((a,b)=>b.n-a.n||a.label.localeCompare(b.label,'ko')).slice(0,n||999)}}}
const STOP=new Set(['그리고','하지만','때문','정도','내가','나는','나의','우리','너무','매우','조금','항상','가끔','다른','이런','그런','어떤','많이','것','수','등','때','위해','통해','대해','같은','먼저','다시']);
function wordFreq(texts,n){const c=counter();texts.forEach(t=>{(String(t||'').match(/[가-힣A-Za-z0-9]{2,}/g)||[]).forEach(w=>{w=w.replace(/(에서는|에서|으로|에게|하고|하는|한다|합니다|해요|하기|하여|해서|있다|있는|없다|없는|하면|하며|입니다|에는|에도|까지|부터|한|할|함|은|는|이|가|을|를|에|의|도|로|과|와|고|며|다|요)$/,'');if(w.length<2||STOP.has(w))return;c.add(w)})});return c.top(n)}
function bar(l,n,max,total,color){return `<div class="br"><span class="bl" title="${esc(l)}">${esc(l)}</span><span class="bt"><i style="width:${max?Math.round(n*100/max):0}%;${color?`--bc:${color}`:''}"></i></span><span class="bn">${n}${total?` (${pct(n,total)}%)`:''}</span></div>`}
function bars(items,total,color){if(!items.length)return'<div class="empty">아직 자료가 없어요.</div>';const mx=Math.max(...items.map(i=>i.n));return items.map(i=>bar(i.label,i.n,mx,total,color)).join('')}
function chips(items){return items.length?`<div class="chips">${items.map(i=>`<span class="chip">${esc(i.label)}<b>${i.n}</b></span>`).join('')}</div>`:'<div class="empty">아직 자료가 없어요.</div>'}
const table=(heads,rows)=>rows.length?`<div class="tbl"><table><thead><tr>${heads.map(h=>`<th class="${h[1]||''}">${h[0]}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:'<div class="empty">아직 자료가 없어요.</div>';

/* ===== 서버 ===== */
let AUTH={};
async function A(a,p){if(DEMO)return demoApi(a,p||{});const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({a,p:p||{},auth:AUTH})});const j=await res.json();if(j&&j.error){const e=new Error(j.error.message);e.code=j.error.code;throw e}return j}

/* ===== 자료 가공 ===== */
let DATA={rows:[]},TAB='status',CLS='all';
function summ(nodes,goal){const a=(nodes||[]).map(n=>n.t==='dec'?`◆${n.q||'갈림길'}(NO→${n.no||'?'})`:(n.title||'')).filter(Boolean);if(goal)a.push(goal);return a.join(' → ')}
function flowHTML(nodes,goal){const p=['<div class="fn start">출발</div>'];(nodes||[]).forEach(n=>p.push(n.t==='dec'?`<div class="fn dec"><b>◆ ${esc(n.q)}?</b><small>NO → ${esc(n.no||'')}</small></div>`:`<div class="fn ${n.stage||''}">${esc(n.title)}${n.memo?`<small>${esc(n.memo)}</small>`:''}</div>`));p.push(`<div class="fn goal">♥ ${esc(goal||'')}</div>`);return `<div class="flow">${p.join('<i class="ar">→</i>')}</div>`}
function prep(rows){return rows.map(r=>{const d=r.data||{},A_=(d.pathA||{}),B_=(d.pathB||{}),cp=d.careerpath||{},R=d.reflect||{};
  return{id:r.id,uid:r.uid,g:r.g,c:r.c,no:r.no,name:r.name,at:r.at,note:r.note||'',ok:!!r.ok,d,goal:d.goal||'',aN:A_.nodes||[],bN:B_.nodes||[],aT:A_.tags||[],bT:B_.tags||[],cp,cells:cp.cells||{},R,res:d.research||[],
    aStep:(A_.nodes||[]).filter(n=>n.t==='step').length,aDec:(A_.nodes||[]).filter(n=>n.t==='dec').length,filled:Number(cp.filled)||0}}).sort((a,b)=>a.g-b.g||a.c-b.c||a.no-b.no)}
const clsKey=x=>`${x.g}-${x.c}`,inCls=x=>CLS==='all'||clsKey(x)===CLS,cur=()=>prep(DATA.rows).filter(inCls),who=x=>`${x.g}-${x.c}-${x.no}`;

/* ===== 제출 현황 ===== */
function vStatus(P){const byC={};P.forEach(p=>byC[clsKey(p)]=(byC[clsKey(p)]||0)+1);const items=Object.entries(byC).sort().map(([k,n])=>({label:k.replace('-','학년 ')+'반',n}));
  const rows=P.map(p=>`<tr class="click" data-open="${esc(p.uid)}"><td class="n">${who(p)}</td><td>${esc(p.name)}</td><td>${esc(p.goal)}</td><td class="n">${p.aStep}${p.aDec?`+◆${p.aDec}`:''}</td><td class="n">${p.bN.length?'○':''}</td><td class="n">${p.filled}/20</td><td class="n">${fmtAt(p.at)}</td><td class="n">${p.ok?'<span class="tag ok">확인</span>':''}</td></tr>`);
  return `<div class="card"><h2>제출 현황</h2><p class="sub">학생이 가입 없이 제출하므로 ‘미제출 명단’은 보이지 않아요. 학급 인원수와 비교해 확인하세요. 같은 학생이 다시 제출하면 가장 최근 제출만 보여요.</p>
  <div class="grid3"><div class="stat"><b>${P.length}</b><span>제출한 학생</span></div><div class="stat"><b>${pct(P.filter(p=>p.bN.length).length,P.length)}%</b><span>경로 B(플랜 B) 작성</span></div><div class="stat"><b>${f1(avg(P.map(p=>p.filled)))}</b><span>양식 평균 작성 칸 (20칸)</span></div><div class="stat"><b>${P.filter(p=>p.res.length).length}</b><span>정보 조사 기록 작성</span></div></div>
  <h3>학급별 제출 수</h3>${bars(items,0,'var(--b1)')}<h3>제출한 학생 (줄을 누르면 자세히 보기)</h3>${table([['번호','n'],['이름'],['목표 직업'],['경로A 단계','n'],['B','n'],['양식 칸','n'],['제출','n'],['확인','n']],rows)}</div>`}

/* ===== 경로 통계 ===== */
function vStats(P){const job=counter(),tagA={},tagB={};TAGS.forEach(t=>{tagA[t]=0;tagB[t]=0});const site=counter();
  P.forEach(p=>{job.add(p.goal);p.aT.forEach(t=>tagA[t]=(tagA[t]||0)+1);p.bT.forEach(t=>tagB[t]=(tagB[t]||0)+1);p.res.forEach(r=>site.add(r.site))});
  const tagBars=m=>bars(Object.entries(m).filter(e=>e[1]>0).map(([label,n])=>({label,n})).sort((a,b)=>b.n-a.n),P.length,'var(--b2)');
  const grad=P.filter(p=>p.aT.includes('대학원')).length, regrow=P.filter(p=>[...p.aN,...p.bN].some(n=>n.stage==='grow')).length, withB=P.filter(p=>p.bN.length).length, dec=P.filter(p=>p.aDec).length;
  const jobsTop=job.top(8).map(j=>{const L=P.filter(p=>norm(p.goal)===norm(j.label)),c=counter();L.forEach(p=>p.aT.forEach(t=>c.add(t)));return `<tr><td>${esc(j.label)}</td><td class="n">${j.n}</td><td>${esc(c.top(4).map(x=>x.label).join(', '))}</td><td class="w">${esc(summ(L[0].aN,''))}</td></tr>`});
  return `<div class="card"><h2>경로 통계</h2><p class="sub">경로 A·B의 단계 이름에서 학교 유형·진학·자격·취업 등을 자동으로 분류(태그)해 셌어요. 참고용이에요.</p>
  <div class="grid3"><div class="stat"><b>${f1(avg(P.map(p=>p.aStep)))}</b><span>경로 A 평균 단계 수</span></div><div class="stat"><b>${pct(dec,P.length)}%</b><span>갈림길(YES/NO) 사용</span></div><div class="stat"><b>${pct(grad,P.length)}%</b><span>대학원 포함 경로</span></div><div class="stat"><b>${pct(regrow,P.length)}%</b><span>취업 후 재진학·자기계발 포함</span></div></div>
  <div class="two"><div><h3>되고 싶은 직업 (많은 순)</h3>${bars(job.top(10),P.length,'var(--b1)')}</div><div><h3>정보 조사에 쓴 곳</h3>${bars(site.top(10),0,'var(--b3)')}</div></div>

function parseJSON(t){t=String(t||'').replace(/```(?:json)?/gi,'');const a=t.indexOf('{'),b=t.lastIndexOf('}');if(a<0||b<a)throw new Error('JSON을 찾지 못했어요. 답변 전체를 붙여 넣었는지 확인해 주세요.');try{return JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('JSON 형식이 맞지 않아요. ('+e.message+')')}}
function normGen(o){if(!o||typeof o!=='object')throw new Error('JSON 모양이 아니에요.');const cp=o.cp||{},cells={},S1=(v,n)=>String(Array.isArray(v)?v.join('\n'):(v==null?'':v)).slice(0,n);
  GKEYS.forEach(k=>cells[k]=S1(cp.cells&&cp.cells[k],400));
  const nodes=a=>(Array.isArray(a)?a:[]).slice(0,12).map(n=>n&&n.t==='dec'?{t:'dec',q:S1(n.q,30),no:S1(n.no,40)}:{t:'step',stage:STAGE_KO[n&&n.stage]?n.stage:'etc',title:S1(n&&n.title,40),memo:S1(n&&n.memo,60)}).filter(n=>n.t==='dec'?filled(n.q):filled(n.title));
  const ref={};REFK.forEach(k=>ref[k]=S1(o.ref&&o.ref[k],400));
  const sims=(Array.isArray(cp.sims)?cp.sims:[]).slice(0,3).map(x=>{const r={};SIMF.forEach(f=>r[f]=S1(x&&x[f],200));return r});
  const goal=S1(o.goal||cp.job,30);
  return{kind:'jinro-sample',v:1,goal,cp:{job:S1(cp.job||goal,30),cells,cases:S1(cp.cases,800),read1:'',read2:'',sims},A:{nodes:nodes(o.A&&o.A.nodes)},B:{nodes:nodes(o.B&&o.B.nodes)},ref}}

function ruleCheck(p){const o=[],a=p.aN,b=p.bN,all=JSON.stringify([...a,...b]);
  if(!filled(p.goal))o.push(['w','목표 직업이 비어 있어요.']);
  if(p.aStep<3)o.push(['w',`경로 A 단계가 ${p.aStep}개예요. 3단계 이상 그려 보게 해 주세요.`]);
  if(!p.aDec)o.push(['t','갈림길(YES/NO)이 없어요. 진학·취업 선택 지점을 넣어 보게 해 보세요.']);
  if(!b.length)o.push(['t','경로 B(플랜 B)가 없어요.']);
  const st=a.filter(n=>n.t==='step').map(n=>n.stage),iH=st.indexOf('hs'),iU=st.indexOf('univ');
  if(iH>=0&&iU>=0&&iU<iH)o.push(['w','‘대학’ 단계가 ‘고등학교’ 단계보다 앞에 있어요. 순서를 확인해 보세요.']);
  if(/(의사|한의사|치과의사|수의사|약사|간호사|변호사|판사|검사|회계사|세무사|교사|교수|조종사|건축사|물리치료사|방사선사|영양사|사회복지사|공인)/.test(p.goal)&&!/자격|면허|시험|국가|수련|임용/.test(all)&&![...a,...b].some(n=>n.stage==='cert'))o.push(['w',`‘${p.goal}’은(는) 면허·자격·시험이 필요한 직업일 수 있는데 경로에 없어요.`]);
  const ti=a.filter(n=>n.t==='step').map(n=>norm(n.title));if(new Set(ti).size<ti.length)o.push(['t','같은 이름의 단계가 반복돼요.']);
  if(p.filled<8)o.push(['t',`커리어패스 양식이 ${p.filled}/20칸이에요.`]);
  if(!filled(p.R.prepIn)&&!filled(p.R.prepOut))o.push(['t','준비할 일(학교 안·밖)이 비어 있어요.']);
  if(!p.res.length)o.push(['t','정보 조사 기록이 없어요.']);
  return o}

  if(act==='aibuild'){const p=buildPrompt(cur(),$('#aiKind').value,$('#aiAnon').checked);$('#aiPrompt').value=p;$('#aiLen').textContent=`${p.length.toLocaleString()}자`+(p.length>40000?' · 길어요. 학급을 골라 나눠 보내세요.':'')}
  if(act==='aicopy'){const v=$('#aiPrompt').value;if(!v){toast('먼저 요청글을 만들어 주세요.');return}try{await navigator.clipboard.writeText(v);toast('복사했어요. AI 도구에 붙여 넣으세요.')}catch(_){$('#aiPrompt').select();document.execCommand('copy');toast('복사했어요.')}}
  if(act==='airun'){const v=$('#aiPrompt').value;if(!v){toast('먼저 요청글을 만들어 주세요.');return}a.disabled=true;a.textContent='분석 중…';try{const r=await A('pathAi',{turns:[{role:'user',content:v}],maxTokens:4000});const out=$('#aiOut');out.hidden=false;out.textContent=r.text+(r.truncated?'\n\n(길어서 중간에 끊겼어요.)':'')}catch(er){toast(er.code==='ai_off'?er.message+' (메뉴 ② AI 키 입력)':(er.message||'분석하지 못했어요.'))}finally{a.disabled=false;a.textContent='여기서 AI로 분석'}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').hidden=true});$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')$('#ov').hidden=true});
$('#fClass').addEventListener('change',e=>{CLS=e.target.value;render()});
document.addEventListener('change',e=>{if(e.target.id==='fSel'){FSEL=e.target.value;render()}});

async function load(show){const b=$('#rbtn');if(b){b.disabled=true;b.textContent='불러오는 중…'}try{const l=await A('pathList');DATA={rows:l.rows||[]};render();if(show)toast('새로 불러왔어요.')}catch(e){toast(e.message||'불러오지 못했어요.')}finally{if(b){b.disabled=false;b.textContent='새로고침'}}}
function showLogin(m){$('#login').hidden=false;$('#lerr').textContent=m||'';$('#tcode').value=''}
async function enter(){$('#login').hidden=true;$('#app').hidden=false;$('#padA').href=PADLET_URL;$('#demoBar').hidden=!DEMO;await load(false)}
$('#lform').addEventListener('submit',async e=>{e.preventDefault();const code=$('#tcode').value.trim();if(!code)return;const btn=$('#lbtn');btn.disabled=true;$('#lerr').textContent='';AUTH={tcode:code};
  try{const me=await A('pathMe');if(me.role!=='teacher')throw new Error('교사 코드가 맞지 않아요.');try{sessionStorage.setItem('pathT',code)}catch(_){}await enter()}catch(er){AUTH={};$('#lerr').textContent=er.code==='bad_login'||er.code==='locked'?er.message:(er.message||'로그인하지 못했어요.')}finally{btn.disabled=false}});
(async function(){let saved='';try{saved=sessionStorage.getItem('pathT')||''}catch(_){}
  if(DEMO){AUTH={tcode:'demo'};await enter();return}
  if(saved){AUTH={tcode:saved};try{const me=await A('pathMe');if(me.role==='teacher'){await enter();return}}catch(_){}AUTH={}}showLogin('')})();

/* ===== 예시 데이터 (#demo) ===== */
function demoApi(a,p){if(!window.__d)window.__d=genDemo();const D=window.__d;
  if(a==='pathMe')return{role:'teacher'};if(a==='pathList')return{rows:D};
  if(a==='pathNote'){const r=D.find(x=>x.uid===p.uid);if(r){r.note=p.note;r.ok=p.ok}return{ok:true}}
  if(a==='pathAi'){const q=(p.turns&&p.turns[0]&&p.turns[0].content)||'';if(q.indexOf('[GEN]')===0){const job=(q.match(/직업·진로 목표: (.*)/)||[])[1]||'예시 직업';return{text:demoGen(job)}}if(q.indexOf('[REVIEW]')===0)return{text:'1. 검증\n- 단계 순서: 맞음\n- 자격·시험: 확인 필요 (공식 사이트 확인)\n\n2. 보완\n일반고 → 대학교 → 국가시험 → 취업\n\n3. 개선 질문\n- 이 직업을 선택한 가장 큰 이유는?\n\n4. 학생에게 줄 조언\n(예시 화면) 실제 서버에서는 AI 결과가 나와요.\n\n5. 교사 메모\n(예시)'};return{text:'(예시 화면) 실제 서버에서는 AI 분석 결과가 여기에 나와요.'}}return{}}
function demoGen(job){const c={};ROWS.forEach(r=>STG.forEach(x=>c[r[0]+'_'+x[0]]=(r[0]==='path'?['일반중학교','일반고·특성화고','4년제 대학교 관련 학과','대학원·수련','취업(예시)'][STG.indexOf(x)]:r[1]+' 예시')));return JSON.stringify({goal:job,cp:{job,cells:c,cases:'관련 책 읽기\n직업 체험 신청',sims:[{name:'비슷한 직업 1',what:'예시',core:'예시',major:'예시',field:'예시',way:'예시'},{name:'비슷한 직업 2',what:'예시',core:'예시',major:'예시',field:'예시',way:'예시'},{name:'비슷한 직업 3',what:'예시',core:'예시',major:'예시',field:'예시',way:'예시'}]},A:{nodes:[{t:'step',stage:'hs',title:'일반고 진학'},{t:'step',stage:'univ',title:'관련 학과 진학'},{t:'dec',q:'진학 여부',no:'바로 취업'},{t:'step',stage:'cert',title:'국가자격시험 합격'},{t:'step',stage:'work',title:'취업'}]},B:{nodes:[{t:'step',stage:'work',title:'취업'},{t:'step',stage:'grow',title:'방송통신대 진학'}]},ref:{why:'(예시) 좋아하는 일이라서',skills:'(예시)',prepIn:'(예시)',prepOut:'(예시)',hard:'(예시)',vow:'(예시)'}})}
function genDemo(){let s=11;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};const pick=a=>a[Math.floor(rnd()*a.length)];
  const names=['가온','나린','다솜','라온','마루','보라','사랑','아름','이든','지안','하준','서윤','도현','예준','유나','시우','채원','민재','수아','주원','태윤','하린','은우','재이'];
  const jobs=['수의사','웹툰 작가','간호사','프로그래머','교사','요리사','게임 개발자','디자이너','의사','경찰관'];
  const P1=[['hs','일반고 진학'],['univ','4년제 대학교 진학'],['work','취업']],P2=[['hs','특성화고 진학'],['work','취업'],['grow','야간대학교 진학']],P3=[['hs','일반고 진학'],['univ','4년제 대학교 진학'],['univ','대학원 진학'],['cert','국가자격시험 합격'],['work','취업']];
  const rows=[];let k=0;[[1,1,12],[1,2,11]].forEach(([g,c,n])=>{for(let no=1;no<=n;no++){if(rnd()<.15)continue;const goal=pick(jobs),pa=pick([P1,P2,P3]),nodes=pa.map(([st,t])=>({t:'step',stage:st,title:t,memo:''}));if(rnd()<.5)nodes.splice(1,0,{t:'dec',q:'진학 여부',no:'바로 취업'});
    const B=rnd()<.6?[{t:'step',stage:'work',title:'취업',memo:''},{t:'step',stage:'grow',title:'방송통신대 진학',memo:''}]:[];const cells={};const f=Math.floor(rnd()*14)+4;ROWS.forEach(r=>STG.forEach(st=>{if(rnd()<f/20)cells[r[0]+'_'+st[0]]=r[0]==='path'?pick(['일반중학교','일반고\n특성화고','4년제 대학교','국가시험 합격','병원 취업']):pick(['성적 관리','독서','자격증','체험 활동','봉사'])}));
    const d={v:2,me:{school:'수명중학교',g,c,no,name:names[k++%names.length]},goal,pathA:{nodes,tags:[],summary:''},pathB:{nodes:B,tags:[],summary:''},research:rnd()<.8?[{site:pick(['커리어넷','워크넷','큐넷(한국산업인력공단)','대학어디가']),found:'필요한 자격과 학과 확인'}]:[],reflect:{why:'어릴 때부터 관심이 있어서',skills:'꾸준한 노력과 자격증',prepIn:pick(['관련 동아리 활동','독서와 성적 관리','진로 수업 참여']),prepOut:pick(['직업 체험 신청','관련 책 읽기','학원 수강']),hard:pick(['성적이 부족할 수 있어서 매일 공부한다','비용이 걱정이라 장학금을 알아본다']),vow:'포기하지 않겠다'},read:{},careerpath:{job:goal,cells,cases:'커리어넷 인터뷰 동영상',sims:[{name:pick(jobs),way:'관련 학과 졸업 후 자격 취득'}],filled:Object.keys(cells).length}};
    const TG=[['일반고',/일반고/],['특성화고',/특성화/],['4년제 대학교',/대학교/],['대학원',/대학원/],['자격·면허시험',/자격|국가/],['취업',/취업/],['방송·사이버대',/방송/]];const tg=ns=>{const t=ns.map(n=>n.title||'').join(' ');return TG.filter(x=>x[1].test(t)).map(x=>x[0])};d.pathA.tags=tg(nodes);d.pathB.tags=tg(B);
    rows.push({id:'DEMO'+g+c+no,at:Date.now()-Math.floor(rnd()*7200e3),uid:`${g}-${c}-${no}`,school:'수명중학교',g,c,no,name:d.me.name,data:d,note:'',ok:false})}});return rows}
</script>
